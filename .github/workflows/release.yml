name: Release

# Pushing a tag vX.Y.Z builds the AppImage and publishes it as a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest
      - name: Check that the tag matches the version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' cherryctl/__init__.py)"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: packaging/appimage/build.sh
      - name: Smoke test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          app="$(ls dist/*.AppImage)"
          "$app" --appimage-extract-and-run --version
          "$app" --appimage-extract-and-run --dry-run dpi 800 1600 3200 6000
          # The window must come up and stay up: timeout ends it with 124.
          status=0
          QT_QPA_PLATFORM=offscreen timeout 10 "$app" --appimage-extract-and-run gui --demo || status=$?
          test "$status" = 124
          status=0
          QT_QPA_PLATFORM=offscreen timeout 10 "$app" --appimage-extract-and-run gui --demo-device "MX board 3 0S" || status=$?
          test "$status" = 124
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.AppImage > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.AppImage SHA256SUMS \
            --title "cherryctl ${GITHUB_REF_NAME#v}" --notes-file ../docs/release-notes.md
